server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: any unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend always calls `/api/...` so one code path serves dev and prod.
    # In dev, Vite's proxy strips the prefix (vite.config.ts); here nginx does.
    location /api/ {
        proxy_pass http://demo-api:8100/;
        proxy_http_version 1.1;

        # SSE dies without these. Buffering on means tokens arrive in one batch
        # at the end of the turn — the stream still "works" but watching the
        # agent think, which is the demo's whole point, is gone.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
