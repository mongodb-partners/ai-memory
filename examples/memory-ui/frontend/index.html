<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Give Your Agents a Memory — MongoDB Atlas</title>

    <!--
      Fonts are self-hosted from /public/fonts, not pulled from
      static.mongodb.com or fonts.googleapis.com. This demo runs at a
      conference booth: a font request that hangs on captive-portal wifi
      renders the whole UI in Times New Roman on the one screen where the
      MongoDB brand actually matters. `preload` on the two fonts used above
      the fold avoids the flash of fallback text.
    -->
    <link
      rel="preload"
      href="/fonts/EuclidCircularA-Regular-WebXL.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/MongoDBValueSerif-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
