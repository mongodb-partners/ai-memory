[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory"
version = "4.1.0"
description = "MongoDB Atlas-backed agent memory: short-term, long-term, episodic, and semantic cache in one cluster"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Mohammad Daoud Farooqi", email = "mohammaddaoud.farooqi@mongodb.com" },
]
keywords = [
    "agent-memory", "mongodb", "atlas", "vector-search", "rag",
    "episodic-memory", "semantic-cache", "mcp", "llm", "agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.2.0",
    "pymongo>=4.12.0",
    "boto3>=1.36.26",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.39.0"]
rest = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
all = [
    "openai>=1.40.0",
    "anthropic>=0.39.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
# The sample UI's backend (examples/memory-ui/server). Not part of `all`: the
# library itself never imports sse-starlette, and a demo dependency has no
# business in a production install.
demo = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "PyJWT>=2.13.0",
    "fastapi>=0.115.0",
    "openai>=1.40.0",
    "anthropic>=0.39.0",
    # The demo server has tests, so its transport must be importable here too.
    "sse-starlette>=2.1.0",
]

# PyPI metadata is immutable per release, so these point at the repository's
# current name. GitHub issues a permanent redirect after a rename, so an
# ai-memory URL keeps resolving once the repo becomes agent-memory; the reverse
# would 404 until the rename actually happened.
[project.urls]
Homepage = "https://github.com/mongodb-partners/ai-memory"
Repository = "https://github.com/mongodb-partners/ai-memory"
Issues = "https://github.com/mongodb-partners/ai-memory/issues"
Changelog = "https://github.com/mongodb-partners/ai-memory/blob/main/CHANGELOG.md"

[project.scripts]
agent-memory = "agent_memory.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

# Explicit allow-list rather than an exclude-list. A live .env exists in this
# working tree, so a forgotten exclude pattern would publish credentials to a
# public index — an unrecoverable mistake, since a PyPI release cannot be edited.
[tool.hatch.build.targets.sdist]
include = [
    "/agent_memory",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "@abstractmethod",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--tb=short"]
testpaths = ["tests"]
