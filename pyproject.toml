[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory"
version = "4.0.0"
description = "MongoDB Atlas-backed agent memory library with MCP + REST shells"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "pymongo>=4.12.0",
    "boto3>=1.36.26",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "tavily-python>=0.5.1",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.39.0"]
rest = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
all = [
    "openai>=1.40.0",
    "anthropic>=0.39.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "PyJWT>=2.13.0",
]

[project.scripts]
agent-memory = "agent_memory.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "@abstractmethod",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--tb=short"]
testpaths = ["tests"]
